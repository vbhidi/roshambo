<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roshambo.</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Roshambo.</h1>
        <div class="buttons-box">
            <button class="btn rock">Rock</button>
            <button class="btn paper">Paper</button>
            <button class="btn scissors">Scissors</button>
        </div>
        <div class="scores">
            <span>Player: <span id="player-score">0</span></span>
            <span>Computer: <span id="computer-score">0</span></span>
        </div>
        <button class="btn reset">Reset</button>
    </main>
    <footer>
        <p>&copy; 2026 <a href="https://github.com/vbhidi" target="_blank" rel="noopener noreferrer">vbhidi</a>. All rights reserved.</p>
    </footer>
</body>
</html>
